<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#343434">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>mosh cam</title>
<style>
:root {
  --bg: #343434;
  --green: #82FF9F;
  --track: #313131;
  --stroke: #666666;
  --knob-off: #BBBBBB;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; touch-action: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, .title { touch-action: manipulation; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--green);
  font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

/* ---------- 01: title ---------- */
.title {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: var(--bg);
  cursor: pointer;
  z-index: 2;
  transition: opacity .35s ease;
}
.title.leaving { opacity: 0; pointer-events: none; }
.title img { display: block; }

/* ---------- 02: camera ---------- */
.cam { position: fixed; inset: 0; background: var(--track); }
body.in-cam { background: var(--track); }
.cam canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
  display: block;
}
.fade {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: calc(140px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--track) calc(13.46px + env(safe-area-inset-bottom, 0px)), rgba(49,49,49,0));
  pointer-events: none;
}
.bar {
  position: absolute;
  left: 50%;
  bottom: env(safe-area-inset-bottom, 0px);
  width: min(100%, 450px);
  height: 134px;           /* control centers sit 67px above the bottom edge */
  transform: translateX(-50%);
}
.bar > button {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 0; border: 0; background: none;
}
.bar > button:disabled { cursor: default; }

.switch {
  left: 23.11%;
  width: 106px; height: 42px;
  border-radius: 63px;
  background: var(--track) !important;
  box-shadow: inset 0 0 0 2px var(--stroke);
}
.knob {
  position: absolute; top: 6px; left: 6px;
  width: 58px; height: 30px;
  border-radius: 26px;
  background: var(--knob-off);
  display: grid; place-items: center;
  transition: left .18s ease, background-color .18s ease;
}
.knob img { display: block; opacity: 0; transition: opacity .12s ease; }
.switch[aria-checked="true"] .knob { left: 42px; background: var(--green); }
.switch[aria-checked="true"] .knob img { opacity: 1; }
.switch:disabled .knob { opacity: .5; }

.shutter { left: 50%; width: 76px; height: 76px; border-radius: 50%; }
.shutter img { display: block; transition: transform .1s ease; }
.shutter:active img { transform: scale(.92); }
.shutter:disabled img { opacity: .5; }

.flip {
  left: 69.89%;
  width: 43px; height: 43px;
  border-radius: 50%;
  background: var(--track) !important;
  box-shadow: inset 0 0 0 2px var(--stroke);
}
.flip img { position: absolute; left: 8px; top: 10px; display: block; transition: transform .3s ease; }
.flip.turning img { transform: rotate(180deg); }

.tone {
  left: 82.78%;
  width: 43px; height: 43px;
  border-radius: 50%;
  background: var(--track) !important;
  box-shadow: inset 0 0 0 2px var(--stroke);
}
.tone img { position: absolute; left: 8px; top: 8px; display: block; object-fit: cover; }

.flash {
  position: absolute; inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}
.flash.on { animation: flash .28s ease-out; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }

.msg {
  position: absolute; left: 50%; top: 42%;
  transform: translate(-50%, -50%);
  width: min(86%, 340px);
  text-align: center;
  font-size: 15px; line-height: 1.6;
  color: var(--green);
}
.msg p { margin: 0 0 16px; }
.msg button {
  border: 0;
  border-radius: 63px;
  background: var(--track);
  box-shadow: inset 0 0 0 2px var(--stroke);
  padding: 10px 22px;
  color: var(--green);
  font-weight: 600;
}
.toast {
  position: absolute; left: 50%;
  bottom: calc(150px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 7px 16px;
  border-radius: 63px;
  background: var(--track);
  box-shadow: inset 0 0 0 2px var(--stroke);
  color: var(--green);
  font-size: 14px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .2s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="title" id="title" role="button" tabindex="0" aria-label="開始">
  <img src="title.svg" width="215" height="199" alt="mosh cam (start)">
</div>

<main class="cam" id="cam" hidden>
  <canvas id="view" aria-label="鏡頭畫面"></canvas>
  <div class="fade"></div>
  <div class="flash" id="flash"></div>
  <div class="msg" id="msg" hidden>
    <p id="msgText"></p>
    <button type="button" id="retry">mosh again</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="bar">
    <button class="switch" id="moshSwitch" type="button" role="switch" aria-checked="false" aria-label="刪 I 幀" disabled>
      <span class="knob"><img src="mosh.svg" width="15" height="21" alt=""></span>
    </button>
    <button class="shutter" id="shutter" type="button" aria-label="截圖" disabled>
      <img src="shutter.svg" width="76" height="76" alt="">
    </button>
    <button class="flip" id="flip" type="button" aria-label="切換前後鏡頭" disabled>
      <img src="reverse.svg" width="27" height="23" alt="">
    </button>
    <button class="tone" id="tone" type="button" aria-label="黑白" aria-pressed="false" disabled>
      <img id="toneColor" src="color.png" width="27" height="27" alt="">
      <img id="toneBk" src="bk.png" width="27" height="27" alt="" hidden>
    </button>
  </div>
</main>

<video id="src" playsinline muted style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<script>
(() => {
  // fixed look
  const BLOCK = 8;      // 方塊大小
  const SEEP = 10;      // 新畫面滲入
  const GAIN = 10;      // 殘差強度 (%)
  const QUANT = 20;     // 量化
  const RES = 256;      // 解析度短邊

  const $ = (s) => document.querySelector(s);
  const video = $('#src');
  const view = $('#view'), vctx = view.getContext('2d');
  const work = document.createElement('canvas');
  const wctx = work.getContext('2d', { willReadFrequently: true });

  const st = {
    facing: 'user',
    mirror: true,
    stream: null,
    ready: false,
    moshing: false,
    starting: false,
    gray: false,
  };

  // ---------- buffers ----------
  let W = 0, H = 0;
  const SCALE = 2;
  let prev, M, Mn, imgA, imgB, curY, prevY, mvx, mvy, bsad, G, imgG;
  let prevFilled = false;

  function setupDims(sw, sh) {
    let w, h;
    const ar = sw / sh;
    if (sw >= sh) { h = RES; w = Math.max(32, Math.round((RES * ar) / 32) * 32); }
    else { w = RES; h = Math.max(32, Math.round((RES / ar) / 32) * 32); }
    if (w === W && h === H && M) return;          // same size: keep the picture (and the mosh) going
    W = w; H = h;
    work.width = W; work.height = H;
    view.width = W * SCALE; view.height = H * SCALE;
    vctx.imageSmoothingEnabled = false;
    const n = W * H * 4;
    prev = new Uint8ClampedArray(n);
    M = new Uint8ClampedArray(n);
    Mn = new Uint8ClampedArray(n);
    imgA = new ImageData(M, W, H);
    imgB = new ImageData(Mn, W, H);
    G = new Uint8ClampedArray(n);
    imgG = new ImageData(G, W, H);
    curY = new Uint8Array((W >> 1) * (H >> 1));
    prevY = new Uint8Array((W >> 1) * (H >> 1));
    const nb = (W / BLOCK) * (H / BLOCK);
    mvx = new Int16Array(nb); mvy = new Int16Array(nb); bsad = new Float32Array(nb);
    prevFilled = false;
    if (st.moshing) setMosh(false);
  }

  function drawCover(ctx, el, sw, sh, mirror) {
    const s = Math.max(W / sw, H / sh);
    const dw = sw * s, dh = sh * s;
    ctx.save();
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(el, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.restore();
  }

  function lumaHalf(rgba, out) {
    const hw = W >> 1, hh = H >> 1, row = W * 4;
    let o = 0;
    for (let y = 0; y < hh; y++) {
      let i = (y * 2) * row;
      for (let x = 0; x < hw; x++, i += 8) {
        const j = i + row;
        out[o++] = (
          rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29 +
          rgba[i + 4] * 77 + rgba[i + 5] * 150 + rgba[i + 6] * 29 +
          rgba[j] * 77 + rgba[j + 1] * 150 + rgba[j + 2] * 29 +
          rgba[j + 4] * 77 + rgba[j + 5] * 150 + rgba[j + 6] * 29
        ) >> 10;
      }
    }
  }

  // block matching on half-res luma → one motion vector per block
  function estimate() {
    const hw = W >> 1, hh = H >> 1;
    const b = BLOCK >> 1, r = 4, n = b * b;
    const gw = W / BLOCK, gh = H / BLOCK;
    const cy = curY, py = prevY;
    function sad(x0, y0, dx, dy, limit) {
      let s = 0;
      for (let y = 0; y < b; y++) {
        const ci = (y0 + y) * hw + x0, pi = (y0 + y + dy) * hw + x0 + dx;
        for (let x = 0; x < b; x++) { const d = cy[ci + x] - py[pi + x]; s += d < 0 ? -d : d; }
        if (s >= limit) return s;
      }
      return s;
    }
    let k = 0;
    for (let gy = 0; gy < gh; gy++) {
      const y0 = gy * b;
      for (let gx = 0; gx < gw; gx++, k++) {
        const x0 = gx * b;
        const zero = sad(x0, y0, 0, 0, Infinity);
        let best = zero, bx = 0, by = 0;
        if (zero / n > 1.5) {
          for (let dy = -r; dy <= r; dy++) {
            const yy = y0 + dy; if (yy < 0 || yy + b > hh) continue;
            for (let dx = -r; dx <= r; dx++) {
              if (!dx && !dy) continue;
              const xx = x0 + dx; if (xx < 0 || xx + b > hw) continue;
              const s = sad(x0, y0, dx, dy, best);
              if (s < best) { best = s; bx = dx; by = dy; }
            }
          }
          if (zero <= best + 1.5 * n) { best = zero; bx = 0; by = 0; }
        }
        mvx[k] = bx * 2; mvy[k] = by * 2; bsad[k] = best / n;
      }
    }
  }

  // decoder-style rebuild: shifted old picture + a little residual, fresh blocks where nothing matches
  function compose(cur) {
    const gw = W / BLOCK, gh = H / BLOCK;
    const k = GAIN / 100, q = QUANT, T = 60 - SEEP * 0.54;
    const src = M, dst = Mn;
    let idx = 0;
    for (let gy = 0; gy < gh; gy++) {
      for (let gx = 0; gx < gw; gx++, idx++) {
        const dx = mvx[idx], dy = mvy[idx];
        const intra = bsad[idx] > T;
        for (let y = 0; y < BLOCK; y++) {
          const row = gy * BLOCK + y;
          let sy = row + dy; if (sy < 0) sy = 0; else if (sy >= H) sy = H - 1;
          for (let x = 0; x < BLOCK; x++) {
            const col = gx * BLOCK + x;
            let sx = col + dx; if (sx < 0) sx = 0; else if (sx >= W) sx = W - 1;
            const i = (row * W + col) * 4, s = (sy * W + sx) * 4;
            if (intra) {
              dst[i] = cur[i]; dst[i + 1] = cur[i + 1]; dst[i + 2] = cur[i + 2];
            } else {
              for (let c = 0; c < 3; c++) {
                let d = cur[i + c] - prev[s + c];
                d = (d > -q && d < q) ? 0 : Math.round(d / q) * q;
                dst[i + c] = src[s + c] + k * d;
              }
            }
            dst[i + 3] = 255;
          }
        }
      }
    }
    M = dst; Mn = src;
    const t = imgA; imgA = imgB; imgB = t;
  }

  function tick() {
    if (!st.ready || !video.videoWidth) return;
    drawCover(wctx, video, video.videoWidth, video.videoHeight, st.mirror);
    const cur = wctx.getImageData(0, 0, W, H).data;
    lumaHalf(cur, curY);
    if (!st.moshing || !prevFilled) M.set(cur);
    else { estimate(); compose(cur); }
    prev.set(cur); prevY.set(curY); prevFilled = true;
    if (st.gray) {
      const src = imgA.data;
      for (let i = 0; i < src.length; i += 4) {
        const y = (src[i] * 77 + src[i + 1] * 150 + src[i + 2] * 29) >> 8;
        G[i] = y; G[i + 1] = y; G[i + 2] = y; G[i + 3] = 255;
      }
      wctx.putImageData(imgG, 0, 0);
    } else {
      wctx.putImageData(imgA, 0, 0);
    }
    vctx.drawImage(work, 0, 0, view.width, view.height);
  }

  let loopOn = false, lastT = 0;
  function startLoop() {
    if (loopOn) return;
    loopOn = true;
    if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
      const f = () => { try { tick(); } catch (e) { console.error(e); } video.requestVideoFrameCallback(f); };
      video.requestVideoFrameCallback(f);
    } else {
      const f = (t) => { if (t - lastT >= 30) { lastT = t; try { tick(); } catch (e) { console.error(e); } } requestAnimationFrame(f); };
      requestAnimationFrame(f);
    }
  }

  // ---------- mosh switch ----------
  function setMosh(on) {
    st.moshing = !!on && st.ready;
    $('#moshSwitch').setAttribute('aria-checked', String(st.moshing));
  }

  // ---------- camera ----------
  function stopStream() {
    if (st.stream) { st.stream.getTracks().forEach((t) => t.stop()); st.stream = null; }
    video.srcObject = null;
  }
  function setControls(on) {
    $('#moshSwitch').disabled = !on;
    $('#shutter').disabled = !on;
    $('#flip').disabled = !on;
    $('#tone').disabled = !on;
  }
  function showMsg(text) {
    $('#msgText').textContent = text;
    $('#msg').hidden = false;
  }

  async function startCamera(facing) {
    if (st.starting) return;
    st.starting = true;
    $('#msg').hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('Please allow camera access');
      st.starting = false;
      return;
    }
    const wanted = facing || st.facing;
    setControls(false);
    stopStream();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: wanted }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false,
      });
      st.stream = stream;
      const s = stream.getVideoTracks()[0].getSettings();
      st.facing = s.facingMode || wanted;
      st.mirror = s.facingMode !== 'environment';
      video.srcObject = stream;
      await video.play();
      if (!video.videoWidth) {
        await new Promise((res) => video.addEventListener('loadedmetadata', res, { once: true }));
      }
      setupDims(video.videoWidth, video.videoHeight);
      st.ready = true;
      setControls(true);
      startLoop();
      checkCameras();
    } catch (err) {
      st.ready = false;
      setMosh(false);
      console.warn('camera error:', err && err.name);
      showMsg('Please allow camera access');
    } finally {
      st.starting = false;
    }
  }

  let camCount = 2;
  async function checkCameras() {
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      camCount = devs.filter((d) => d.kind === 'videoinput').length;
    } catch { /* assume there is another camera */ }
  }

  // ---------- screenshot ----------
  function stamp() {
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }
  let toastT;
  function toast(text) {
    const t = $('#toast');
    t.textContent = text; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2000);
  }
  function flash() {
    const f = $('#flash');
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  }

  const inClaude = !!(window.claude && typeof window.claude.use === 'function');
  let downloadsNS = null;
  if (inClaude) window.claude.use('downloads').then((d) => { downloadsNS = d; }).catch(() => {});

  function snap() {
    if (!st.ready) return;
    flash();
    // export at 4x the working size, keeping the blocks sharp
    const out = document.createElement('canvas');
    out.width = W * 4; out.height = H * 4;
    const octx = out.getContext('2d');
    octx.imageSmoothingEnabled = false;
    octx.drawImage(work, 0, 0, out.width, out.height);
    const name = 'moshcam-' + stamp() + '.png';

    // build the file synchronously so the share sheet still counts as a tap response
    const dataUrl = out.toDataURL('image/png');
    const bin = atob(dataUrl.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'image/png' });

    if (inClaude) {
      if (!downloadsNS) { toast('這裡無法存檔'); return; }
      downloadsNS.save({ filename: name, data: blob })
        .then((r) => { if (r && r.status === 'saved') toast('已存檔'); })
        .catch((e) => { if (e && e.code !== 'declined') toast('這裡無法存檔'); });
      return;
    }

    const touch = window.matchMedia('(pointer: coarse)').matches;
    if (touch && typeof File === 'function' && navigator.canShare) {
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch((e) => {
          if (e && e.name !== 'AbortError') download(blob, name);
        });
        return;
      }
    }
    download(blob, name);
  }
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  }

  // ---------- wiring ----------
  function enter() {
    const title = $('#title');
    if (title.classList.contains('leaving')) return;
    title.classList.add('leaving');
    document.body.classList.add('in-cam');
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', '#313131');
    $('#cam').hidden = false;
    if (window.matchMedia('(pointer: coarse)').matches && document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
    }
    startCamera('user');
    setTimeout(() => { title.hidden = true; }, 400);
  }
  $('#title').addEventListener('click', enter);
  $('#title').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); }
  });

  $('#moshSwitch').addEventListener('click', () => setMosh(!st.moshing));
  $('#shutter').addEventListener('click', snap);
  $('#flip').addEventListener('click', () => {
    if (camCount < 2) { toast('這台裝置只有一顆鏡頭'); return; }
    const b = $('#flip');
    b.classList.toggle('turning');
    startCamera(st.facing === 'user' ? 'environment' : 'user');
  });
  $('#retry').addEventListener('click', () => startCamera());
  $('#tone').addEventListener('click', () => {
    st.gray = !st.gray;
    $('#tone').setAttribute('aria-pressed', String(st.gray));
    $('#toneColor').hidden = st.gray;
    $('#toneBk').hidden = !st.gray;
  });

  // ---------- no pinch / double-tap zoom ----------
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) =>
    document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
  document.addEventListener('touchstart', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    // quick second tap outside the buttons would be a double-tap zoom; buttons keep rapid taps
    if (now - lastTouchEnd < 320 && !(e.target.closest && e.target.closest('button'))) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopStream(); st.ready = false; setControls(false); }
    else if (!$('#cam').hidden && !st.stream) startCamera();
  });
})();
</script>
</body>
</html>
